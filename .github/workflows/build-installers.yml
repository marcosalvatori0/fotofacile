name: Crea gli installer (macOS e Windows)

# Cosa fa: a ogni nuova versione (tag «vX.Y.Z») costruisce gli installatori su computer
# veri — macOS per il .dmg, Windows per l'eseguibile — e li allega a una Release su GitHub.
# Si può lanciare anche a mano da Actions → Run workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Installatore macOS (dmg)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le dipendenze (PyInstaller + PyObjC per il collegamento diretto)
        run: python -m pip install --upgrade pip pyinstaller pillow && python -m pip install -r requirements.txt
      - name: Crea l'app
        run: python scripts/build_app.py --no-zip
      - name: Verifica l'app (diagnosi, sempre possibile)
        run: dist/FotoFacile.app/Contents/MacOS/FotoFacile doctor
      - name: Autocollaudo grafico (deve riuscire, altrimenti la Release non parte)
        run: dist/FotoFacile.app/Contents/MacOS/FotoFacile --selftest
        timeout-minutes: 3
      - name: Crea il disco di installazione
        run: python scripts/crea_installer_mac.py
      - name: Carica l'installatore
        uses: actions/upload-artifact@v4
        with:
          name: FotoFacile-macOS
          path: dist/*.dmg

  windows:
    name: Installatore Windows (exe)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le dipendenze (PyInstaller e Pillow per la conversione WebP)
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Leggi la versione
        id: versione
        shell: bash
        run: echo "v=$(python scripts/leggi_versione.py)" >> "$GITHUB_OUTPUT"
      # Sono i test scritti su macOS: alcuni potrebbero non essere pronti per Windows. Un
      # difetto dei test non deve impedire di costruire e provare l'installatore, quindi qui
      # non blocca (compare come avviso giallo). Dopo la prima esecuzione pulita si può
      # togliere «continue-on-error».
      - name: Esegui i test
        continue-on-error: true
        run: python -m pip install pytest && python -m pytest tests -x
      - name: Crea l'eseguibile
        run: python scripts/build_app.py --no-zip
      # L'eseguibile non ha finestra nera: l'esito si legge dai file selftest.txt e
      # diagnosi.txt (non dal codice di uscita), vedi verifica-eseguibile.ps1.
      - name: Verifica l'eseguibile (autocollaudo + diagnosi)
        shell: pwsh
        run: ./installer/windows/verifica-eseguibile.ps1 -Eseguibile "dist/FotoFacile/FotoFacile.exe"
        timeout-minutes: 5
      - name: Versione portatile (zip)
        run: python -c "import shutil; shutil.make_archive('dist/FotoFacile-portable', 'zip', 'dist', 'FotoFacile')"
      - name: Installa Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Crea il programma di installazione (.exe)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Host "ISCC.exe non trovato: Inno Setup non è stato installato"; exit 1 }
          Write-Host "Uso $iscc"
          & $iscc "/DVersione=${{ steps.versione.outputs.v }}" installer\windows\FotoFacile.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prova davvero l'installatore (installa, avvia, disinstalla)
        shell: pwsh
        run: ./installer/windows/prova-installazione.ps1 -Installatore "dist/installer/FotoFacile-Setup-${{ steps.versione.outputs.v }}.exe"
        timeout-minutes: 10
      - name: Somme di controllo
        shell: pwsh
        run: |
          Get-ChildItem dist/installer/*.exe, dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      # «always()»: se la prova fallisce serve comunque il log dell'installazione.
      - name: Carica gli installer e il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FotoFacile-Windows
          if-no-files-found: warn
          path: |
            dist/installer/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            log-installazione.txt

  release:
    name: Pubblica la Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatti
      - name: Elenca i file raccolti
        run: find artefatti -type f | sort
      - name: Crea la Release con gli installer
        uses: softprops/action-gh-release@v2
        with:
          name: "FotoFacile ${{ github.ref_name }}"
          body: |
            Installatori di FotoFacile (copia le foto dal telefono Android al computer).

            - **macOS**: `FotoFacile-<versione>.dmg` — aprilo e trascina l'app in Applicazioni.
              La prima volta: clic destro sull'icona → Apri (l'app non è firmata).
            - **Windows**: `FotoFacile-Setup-<versione>.exe` — installa il programma con
              collegamenti e disinstallazione. In alternativa lo zip portatile
              `FotoFacile-portable.zip`, che funziona senza installare nulla.

            Prima volta con il telefono: collegalo con il cavo, sbloccalo e scegli
            «Trasferimento file» quando il telefono lo chiede.

            Windows può mostrare un avviso blu («Windows ha protetto il PC»): il programma
            non è firmato. Premi «Ulteriori informazioni» e poi «Esegui comunque».
            Le somme di controllo dei file sono in `SHA256SUMS.txt`.
          files: |
            artefatti/**/*.dmg
            artefatti/**/*.exe
            artefatti/**/*.zip
            artefatti/**/SHA256SUMS.txt
          draft: false
          prerelease: false
