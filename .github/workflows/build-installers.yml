name: Crea gli installer (macOS e Windows)

# Cosa fa: a ogni nuova versione (tag «vX.Y.Z») costruisce gli installatori su computer
# veri — macOS per il .dmg, Windows per l'eseguibile — e li allega a una Release su GitHub.
# Si può lanciare anche a mano da Actions → Run workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Installatore macOS (dmg)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Crea l'app
        run: python scripts/build_app.py --no-zip
      - name: Verifica l'app (diagnosi, sempre possibile)
        run: dist/FotoFacile.app/Contents/MacOS/FotoFacile doctor
      - name: Autocollaudo grafico (se il runner ha una sessione grafica)
        run: dist/FotoFacile.app/Contents/MacOS/FotoFacile --selftest || echo "::warning::autocollaudo grafico non disponibile su questo runner"
        timeout-minutes: 3
      - name: Crea il disco di installazione
        run: python scripts/crea_installer_mac.py
      - name: Carica l'installatore
        uses: actions/upload-artifact@v4
        with:
          name: FotoFacile-macOS
          path: dist/*.dmg

  windows:
    name: Installatore Windows (exe)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Crea l'eseguibile
        run: python scripts/build_app.py --no-zip
      - name: Verifica l'eseguibile (diagnosi + autocollaudo)
        run: |
          dist\FotoFacile\FotoFacile.exe doctor
          dist\FotoFacile\FotoFacile.exe --selftest
        timeout-minutes: 5
      - name: Versione portatile (zip)
        run: python -c "import scripts.crea_pacchetto_windows as p, pathlib, shutil; shutil.make_archive('dist/FotoFacile-portable', 'zip', 'dist', 'FotoFacile')"
      - name: Installa Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Crea il programma di installazione (.exe)
        run: "& 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' installer\\windows\\FotoFacile.iss"
      - name: Carica gli installer
        uses: actions/upload-artifact@v4
        with:
          name: FotoFacile-Windows
          path: |
            dist/installer/*.exe
            dist/*.zip

  release:
    name: Pubblica la Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatti
      - name: Elenca i file raccolti
        run: find artefatti -type f | sort
      - name: Crea la Release con gli installer
        uses: softprops/action-gh-release@v2
        with:
          name: "FotoFacile ${{ github.ref_name }}"
          body: |
            Installatori di FotoFacile (copia le foto dal telefono Android al computer).

            - **macOS**: `FotoFacile-<versione>.dmg` — aprilo e trascina l'app in Applicazioni.
              La prima volta: clic destro sull'icona → Apri (l'app non è firmata).
            - **Windows**: `FotoFacile-Setup-<versione>.exe` — installa il programma con
              collegamenti e disinstallazione. In alternativa lo zip portatile
              `FotoFacile-portable.zip`, che funziona senza installare nulla.

            Prima volta con il telefono: collegalo con il cavo, sbloccalo e nel programma premi
            «Come si attiva il Debug USB?» seguendo i passaggi della tua marca. Quando il
            telefono chiede «Consentire il debug USB?», tocca «Consenti».
          files: |
            artefatti/**/*.dmg
            artefatti/**/*.exe
            artefatti/**/*.zip
          draft: false
          prerelease: false
